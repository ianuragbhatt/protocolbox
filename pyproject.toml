[project]
name = "protocolbox"
version = "0.1.2"
description = "The Standard Library for the Agentic Web — verified MCP tools for any AI Agent."
readme = "README.md"
authors = [
  { name = "Anurag Bhatt", email = "anurag@protocolbox.in" },
]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=0.1.0",
    "html2text",
    "json_repair",
    "reportlab",
    "httpx",
    "typer",
]

[project.urls]
Homepage = "https://protocolbox.in"
Repository = "https://github.com/ianuragbhatt/protocolbox"
Issues = "https://github.com/ianuragbhatt/protocolbox/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
protocolbox = "protocolbox.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protocolbox"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
